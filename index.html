<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Smart Hotel | AI-Powered Hotel Management System</title>
    <meta name="description" content="Experience luxury redefined at Novotel Vizag. Book rooms, order food, explore nearby attractions, and manage your entire stay through our smart AI-powered hotel portal." />
    <meta name="keywords" content="smart hotel, hotel management, Novotel Vizag, book room, hotel AI, hospitality, Vizag hotel" />
    <meta name="author" content="Smart Hotel Management" />
    <meta name="robots" content="index, follow" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smart Hotel | AI-Powered Hotel Management" />
    <meta property="og:description" content="Your smart concierge at Novotel Vizag. Book, dine, explore — all in one place." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Performance: Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://maps.googleapis.com" />

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Accessibility: Don't flash white -->
    <style>
      html, body { background-color: #020617; color: #f8fafc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
